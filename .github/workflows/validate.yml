name: Validate template

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/risk-notification-poller/package-lock.json

      - name: Verify PowerShell 7.6 or newer
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6' -or -not [Environment]::Is64BitProcess) {
            throw "Expected 64-bit PowerShell 7.6 or newer; observed $($PSVersionTable.PSVersion)."
          }

      - name: Install repository validation dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser
          az bicep install --version v0.46.1

      - name: Run offline repository validation
        shell: pwsh
        run: ./scripts/Test-Repository.ps1
